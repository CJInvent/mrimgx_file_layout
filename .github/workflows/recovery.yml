name: Recovery regression tests
on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'build-recovery.cmd'
      - '.github/workflows/recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native recovery tool
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          & cmd /c build-recovery.cmd "$vs\VC\Auxiliary\Build\vcvars64.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test strict and explicit recovery paths
        run: |
          python -m pip install zstandard
          python tools/test_recovery.py build/img_to_vhdx.exe
      - uses: actions/upload-artifact@v4
        with:
          name: img_to_vhdx-windows-x64
          path: build/img_to_vhdx.exe
